<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arvia</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link href="css/style-projects.css" rel="stylesheet" type="text/css">
</head>

<body>

<section id="hero">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                <img src="images/ArviaBlack-Logo.png" alt="Logo" height="40">
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarScroll"
                aria-controls="navbarScroll"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarScroll">

                <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll"
                    style="--bs-scroll-height: 100px;">

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            About
                        </a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown"
                           aria-expanded="false">

                            Projects
                        </a>

                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="#">
                                    Action
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" href="#">
                                    Another action
                                </a>
                            </li>

                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <li>
                                <a class="dropdown-item" href="#">
                                    Something else here
                                </a>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">
                            Link
                        </a>
                    </li>

                </ul>

                <form class="d-flex" role="search">
                    <input class="form-control me-2"
                           type="search"
                           placeholder="Search"
                           aria-label="Search">

                    <button class="btn btn-outline-success" type="submit">
                        Search
                    </button>
                </form>

            </div>
        </div>
    </nav>

<div id="projects-show" class="projects">

  <div class="container-show">

    <div class="img-box projectPhoto-box">
                <!-- Previous Button -->
        <button class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleDark"
            data-bs-slide="prev">

            <span class="carousel-control-prev-icon" aria-hidden="true"></span>

            <span class="visually-hidden">
                Previous
            </span>
        </button>

      <img src="images/chosen-1.jpeg" class="img-thumbnail" alt="...">

        <!-- Next Button -->
        <button class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleDark"
            data-bs-slide="next">

            <span class="carousel-control-next-icon" aria-hidden="true"></span>

            <span class="visually-hidden">
                Next
            </span>
        </button>
              <!-- Indicators -->
        <div class="carousel-indicators">

            <button type="button"
                data-bs-target="#carouselExampleDark"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleDark"
                data-bs-slide-to="1"
                aria-label="Slide 2">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleDark"
                data-bs-slide-to="2"
                aria-label="Slide 3">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleDark"
                data-bs-slide-to="3"
                aria-label="Slide 4">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleDark"
                data-bs-slide-to="4"
                aria-label="Slide 5">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleDark"
                data-bs-slide-to="5"
                aria-label="Slide 6">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleDark"
                data-bs-slide-to="6"
                aria-label="Slide 7">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleDark"
                data-bs-slide-to="7"
                aria-label="Slide 8">
            </button>

            <button type="button"
                data-bs-target="#carouselExampleDark"
                data-bs-slide-to="8"
                aria-label="Slide 9">
            </button>
        </div>
        
      <div class="text">
        <h3 class="title-Card" > Living Room </h3>
        <h5 class="subtitle-Card"> Designed for Comfort and Connection  </h5>
      </div> 
    </div>

  </div>

</div>

</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
